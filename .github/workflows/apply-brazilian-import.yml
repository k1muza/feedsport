name: Apply Brazilian swine import

on:
  push:
    branches:
      - feature/brazilian-swine-import
    paths:
      - .github/workflows/apply-brazilian-import.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brazilian-swine-import
          fetch-depth: 0

      - name: Validate and apply import
        run: |
          node --check scripts/import-brazilian-swine.mjs
          npm run data:import-brazilian-swine -- --dry-run --report /tmp/brazilian-swine-report.json
          npm run data:import-brazilian-swine
          cat /tmp/brazilian-swine-report.json

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ingredients.json src/data/nutrients.json
          if git diff --cached --quiet; then
            echo "Data files already current."
          else
            git commit -m "Apply corrected Brazilian swine energy data"
            git push origin HEAD:feature/brazilian-swine-import
          fi
