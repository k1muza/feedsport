name: Test Brazilian swine importer

on:
  push:
    branches:
      - feature/brazilian-swine-import
    paths:
      - .github/workflows/test-brazilian-swine-import.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brazilian-swine-import

      - name: Syntax check
        run: node --check scripts/import-brazilian-swine.mjs

      - name: Regression checks
        run: npm run data:test-brazilian-swine
