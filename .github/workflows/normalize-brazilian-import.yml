name: Normalize Brazilian import data

on:
  push:
    branches:
      - feature/brazilian-swine-import
    paths:
      - .github/workflows/normalize-brazilian-import.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brazilian-swine-import
          fetch-depth: 0

      - name: Match ingredients line endings to main
        shell: python
        run: |
          import pathlib
          import subprocess

          path = pathlib.Path("src/data/ingredients.json")
          base = subprocess.check_output(["git", "show", "origin/main:src/data/ingredients.json"])
          current = path.read_bytes()
          eol = b"\r\n" if b"\r\n" in base else b"\n"
          normalized = current.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          path.write_bytes(normalized.replace(b"\n", eol))
          print("Using CRLF" if eol == b"\r\n" else "Using LF")

      - name: Run committed-source import
        run: |
          node --check scripts/import-brazilian-swine.mjs
          npm run data:import-brazilian-swine -- --dry-run --report /tmp/brazilian-swine-report.json
          npm run data:import-brazilian-swine
          cat /tmp/brazilian-swine-report.json

      - name: Commit normalized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ingredients.json src/data/nutrients.json
          if git diff --cached --quiet; then
            echo "Data files already normalized."
          else
            git commit -m "Normalize imported swine nutrient data"
            git push origin HEAD:feature/brazilian-swine-import
          fi
